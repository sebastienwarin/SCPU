name: PlatformIO CI

on:
  push:
    paths: ["firmware/slink/**", ".github/workflows/platformio-ci.yml"]
  pull_request:
    paths: ["firmware/slink/**", ".github/workflows/platformio-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev_esp32_c3, prod_esp32_c3, dev_esp32_s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip platformio
      - working-directory: firmware/slink
        run: pio run -e ${{ matrix.env }}

  build-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip platformio
      - working-directory: firmware/slink
        run: pio run -e dev_esp32_c3 -t buildfs
