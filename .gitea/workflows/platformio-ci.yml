name: PlatformIO CI

on:
  push:
    paths:
      - "firmware/slink/**"
      - ".gitea/workflows/platformio-ci.yml"
  pull_request:
    paths:
      - "firmware/slink/**"
      - ".gitea/workflows/platformio-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - dev_esp32_c3
          - prod_esp32_c3
          - dev_esp32_s3
          #- test_lolin32
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Ensure venv support is available
        run: |
          set -e
          if python3 -m venv .venv-check >/dev/null 2>&1; then
            rm -rf .venv-check
            echo "venv support already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "Failed to create venv and apt-get is not available on this runner"
            exit 1
          fi

          PY_MM="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          PKG="python${PY_MM}-venv"
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y "$PKG" || sudo apt-get install -y python3-venv
          else
            apt-get update
            apt-get install -y "$PKG" || apt-get install -y python3-venv
          fi

          python3 -m venv .venv-check
          rm -rf .venv-check

      - name: Create venv and install PlatformIO
        run: |
          python3 -m venv .venv-ci
          ./.venv-ci/bin/python -m pip install --upgrade pip
          ./.venv-ci/bin/python -m pip install platformio

      - name: Build firmware
        working-directory: firmware/slink
        run: ../../.venv-ci/bin/python -m platformio run -e ${{ matrix.env }}

  build-filesystem:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Ensure venv support is available
        run: |
          set -e
          if python3 -m venv .venv-check >/dev/null 2>&1; then
            rm -rf .venv-check
            echo "venv support already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "Failed to create venv and apt-get is not available on this runner"
            exit 1
          fi

          PY_MM="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          PKG="python${PY_MM}-venv"
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y "$PKG" || sudo apt-get install -y python3-venv
          else
            apt-get update
            apt-get install -y "$PKG" || apt-get install -y python3-venv
          fi

          python3 -m venv .venv-check
          rm -rf .venv-check

      - name: Create venv and install PlatformIO
        run: |
          python3 -m venv .venv-ci
          ./.venv-ci/bin/python -m pip install --upgrade pip
          ./.venv-ci/bin/python -m pip install platformio

      - name: Build filesystem image
        working-directory: firmware/slink
        run: ../../.venv-ci/bin/python -m platformio run -e dev_esp32_c3 -t buildfs
