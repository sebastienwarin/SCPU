name: Software CI

on:
  push:
    branches:
      - "**"
    paths:
      - "software/**"
      - ".gitea/workflows/ci.yml"
  pull_request:
    paths:
      - "software/**"
      - ".gitea/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Install Actions runtime
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git nodejs

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore software/SCPU.sln -p:Platform="Any CPU"

      - name: Build
        run: >-
          dotnet build software/SCPU.sln
          --configuration Release
          --no-restore
          -p:Platform="Any CPU"

      - name: Test
        run: >-
          dotnet test software/SCPU.sln
          --configuration Release
          --no-build
          --no-restore
          -p:Platform="Any CPU"
          --logger "console;verbosity=normal"
